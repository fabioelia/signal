name: Deploy to GitHub Pages

# Publishes the static client (public/ + shared/) to GitHub Pages.
# The Pages build has no game server, so it runs in pass-and-play mode;
# it can also connect to a hosted server via ?server=wss://…
#
# If the first run fails on "configure-pages", enable Pages once in the
# repo settings: Settings → Pages → Source: "GitHub Actions", then re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/shared
          cp public/* _site/
          cp shared/*.js _site/shared/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
